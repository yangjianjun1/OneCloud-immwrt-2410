name: Build OneCloud 测试
on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      ssh:
        description: 'SSH connection to Actions'
        required: false
        default: 'false'
env:
  REPO_URL: https://github.com/openwrt/openwrt.git
  REPO_BRANCH: openwrt-24.10
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: onecloud.config
  DIY_P1_SH: op1.sh
  DIY_P2_SH: op2.sh
  DIY_P3_SH: op3.sh
  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: false
  TZ: Asia/Shanghai
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc
        sudo docker image prune --all --force
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache cmake cpio curl device-tree-compiler fastjar flex gawk gettext gcc-multilib g++-multilib git gperf haveged help2man intltool libncurses-dev libssl-dev libtool lrzsz mkisofs msmtp nano ninja-build p7zip p7zip-full patch pkgconf python2.7 python3 python3-pip python3-ply python3-docutils qemu-utils rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /workdir
        sudo chown $USER:$GROUPS /workdir
    - name: Clone source code
      working-directory: /workdir
      run: |
        df -hT $PWD
        git clone $REPO_URL -b $REPO_BRANCH openwrt
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt
    - name: Load onecloud target
      run: |
        [ -e target ] && cp -rf target openwrt/
    - name: Load custom feeds
      run: |
        [ -e $FEEDS_CONF ] && mv $FEEDS_CONF openwrt/feeds.conf.default
        chmod +x $DIY_P1_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P1_SH
    - name: Update feeds
      run: cd openwrt && ./scripts/feeds update -a
    - name: Remove some feeds
      run: |
        chmod +x $DIY_P3_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P3_SH
    - name: Second update feed
      run: cd openwrt && ./scripts/feeds update -a
    - name: Install feeds
      run: cd openwrt && ./scripts/feeds install -a
    - name: Load custom configuration
      run: |
        [ -e files ] && mv files openwrt/files
        [ -e $CONFIG_FILE ] && mv $CONFIG_FILE openwrt/.config
        chmod +x $DIY_P2_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P2_SH
    - name: SSH connection to Actions
      uses: P3TERX/ssh2actions@v1.0.0
      if: (github.event.inputs.ssh == 'true' && github.event.inputs.ssh  != 'false') || contains(github.event.action, 'ssh')
      env:
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
    - name: Download package source
      id: package
      run: |
        cd openwrt
        make defconfig
        make download -j8
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;
    - name: Compile the firmware
      id: compile
      run: |
        cd openwrt
        echo -e "$(nproc) thread compile"
        if ! make -j$(nproc); then
            echo "make -j1 retry..."
            if ! make -j1 V=s; then
                echo "compile failed"
                exit 1
            fi
        fi
        echo "status=success" >> $GITHUB_OUTPUT
        grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
        [ -s DEVICE_NAME ] && echo "DEVICE_NAME=_$(cat DEVICE_NAME)" >> $GITHUB_ENV
        echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

    # 提取rootfs并打包 rootfs.tar.gz
    - name: Extract and compress rootfs
      if: steps.compile.outputs.status == 'success' && !cancelled()
      run: |
        cd openwrt/bin/targets/*/*
        ROOTFS_RAW=$(ls rootfs-*.tar 2>/dev/null | head -n1)
        if [ -n "$ROOTFS_RAW" ];then
          echo "Found rootfs raw: $ROOTFS_RAW"
          mkdir -p rootfs_tmp
          tar -xf "$ROOTFS_RAW" -C rootfs_tmp
          tar -zcvf rootfs.tar.gz -C rootfs_tmp .
          rm -rf rootfs_tmp
          ls -lh rootfs.tar.gz
        else
          echo "Warning: rootfs-*.tar not found, skip rootfs.tar.gz generate"
        fi

    # 调用convert2.sh生成晶晨整盘包+线刷包
    - name: Generate Amlogic img & burn.img (convert2.sh)
      if: steps.compile.outputs.status == 'success' && !cancelled()
      run: |
        chmod +x $GITHUB_WORKSPACE/Scripts/convert2.sh
        $GITHUB_WORKSPACE/Scripts/convert2.sh

    # 复制晶晨固件产物到target目录，用于Artifact & Release上传
    - name: Copy amlogic firmware to target output dir
      if: steps.compile.outputs.status == 'success' && !cancelled()
      run: |
        TARGET_OUT=$(find openwrt/bin/targets -maxdepth 2 -type d | head -n1)
        cp -v $GITHUB_WORKSPACE/openwrt*.xz $GITHUB_WORKSPACE/openwrt*.sha "${TARGET_OUT}/"

    # 打包全部feed编译ipk为 ipk-packages.tar.gz
    - name: Archive all compiled ipk packages
      if: steps.compile.outputs.status == 'success' && !cancelled()
      run: |
        TARGET_OUT=$(find openwrt/bin/targets -maxdepth 2 -type d | head -n1)
        cd openwrt/bin
        tar -zcvf "${TARGET_OUT}/ipk-packages.tar.gz" packages/
        ls -lh "${TARGET_OUT}/ipk-packages.tar.gz"

    - name: Check space usage
      if: (!cancelled())
      run: df -hT

    - name: Upload bin directory
      uses: actions/upload-artifact@v4
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true'
      with:
        name: OpenWrt-i2410_bin${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: openwrt/bin
    - name: Organize files
      id: organize
      if: env.UPLOAD_FIRMWARE == 'true' && !cancelled() && steps.compile.outputs.status == 'success'
      run: |
        cd openwrt/bin/targets/*/*
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT
    - name: Upload firmware directory
      uses: actions/upload-artifact@v4
      if: steps.organize.outputs.status == 'success' && !cancelled()
      with:
        name: OpenWrt-i2410_firmware${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE }}
    - name: Generate release tag
      id: tag
      if: env.UPLOAD_RELEASE == 'true' && !cancelled() && steps.compile.outputs.status == 'success'
      run: |
        echo "release_tag=$(date +"%Y.%m.%d-%H%M")${{ env.DEVICE_NAME }}_OpenWrt24.10" >> $GITHUB_OUTPUT
        touch release.txt
        echo "Firmware: OpenWrt 24.10 ${{ env.DEVICE_NAME }}" >> release.txt
        echo "Build Time: $(date +"%Y-%m-%d %H:%M")" >> release.txt
        echo "status=success" >> $GITHUB_OUTPUT
    - name: Upload firmware to release
      uses: softprops/action-gh-release@v2
      if: steps.tag.outputs.status == 'success' && !cancelled() && steps.compile.outputs.status == 'success'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.tag.outputs.release_tag }}
        body_path: release.txt
        files: ${{ env.FIRMWARE }}/*
    - name: Delete workflow runs
      uses: Mattraks/delete-workflow-runs@v2
      with:
        retain_days: 7
        keep_minimum_runs: 2
    # ========== 保留最近5个Release，其余自动删除 ==========
    - name: Remove old Releases (gh cli)
      if: env.UPLOAD_RELEASE == 'true' && !cancelled() && steps.compile.outputs.status == 'success'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        # 列出所有release，按发布时间倒序，保留前5个，其余删除
        RELEASES=$(gh release list --json tagName,publishedAt --order desc | jq -r '.[5:] | .[].tagName')
        for TAG in $RELEASES; do
          echo "Delete Release: $TAG"
          gh release delete "$TAG" -y
          echo "Delete git tag: $TAG"
          git push origin --delete "$TAG"
        done
