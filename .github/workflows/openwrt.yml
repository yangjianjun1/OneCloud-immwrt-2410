name: 编译 OneCloud OpenWrt
on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      ssh:
        description: '开启 Actions SSH 调试连接'
        required: false
        default: 'false'
  schedule:
    - cron: '0 16 10 * *'
env:
  REPO_URL: https://github.com/openwrt/openwrt.git
  REPO_BRANCH: openwrt-24.10
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: onecloud.config
  DIY_P1_SH: op1.sh
  DIY_P2_SH: op2.sh
  DIY_P3_SH: op3.sh
  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai
  CCACHE_DIR: /home/runner/.ccache
  AMLIMG_VERSION: v0.3.2
  UBOOT_TPL_URL: https://github.com/rmoyulong/u-boot-onecloud/releases/download/Onecloud_Uboot_23.12.24_18.15.09/eMMC.burn.img
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4
      - name: 加载编译缓存 ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: openwrt-ccache-${{ env.REPO_BRANCH }}
      - name: 初始化编译环境
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -rf /etc/apt/sources.list.d/*
          sudo apt-get update -qq
          sudo apt-get install -y ack antlr3 asciidoc autoconf automake autopoint binutils bison build‑essential \
          bzip2 ccache cmake cpio curl device‑tree‑compiler flex gawk gcc‑multilib git gperf libncurses‑dev \
          libssl‑dev libtool make msmtp nano ninja‑build patch pkgconf python3 python3‑pip qemu‑utils rsync sed \
          subversion swig tar unzip wget xz‑utils zlib1g‑dev
      - name: 克隆 OpenWrt 源码
        run: |
          set -eo pipefail
          cd $GITHUB_WORKSPACE
          git clone ${{ env.REPO_URL }} -b ${{ env.REPO_BRANCH }} openwrt
      - name: 复制自定义配置与脚本
        run: |
          set -eo pipefail
          cd $GITHUB_WORKSPACE
          [ -d files ] && cp -rf files openwrt/
          [ -f ${{ env.CONFIG_FILE }} ] && cp ${{ env.CONFIG_FILE }} openwrt/.config
          [ -f ${{ env.DIY_P1_SH }} ] && chmod +x ${{ env.DIY_P1_SH }} && cp ${{ env.DIY_P1_SH }} openwrt/
          [ -f ${{ env.DIY_P2_SH }} ] && chmod +x ${{ env.DIY_P2_SH }} && cp ${{ env.DIY_P2_SH }} openwrt/
          [ -f ${{ env.DIY_P3_SH }} ] && chmod +x ${{ env.DIY_P3_SH }} && cp ${{ env.DIY_P3_SH }} openwrt/
      - name: 第一阶段自定义脚本
        run: |
          cd $GITHUB_WORKSPACE/openwrt
          [ -f ${{ env.DIY_P1_SH }} ] && ./${{ env.DIY_P1_SH }}
      - name: 更新与安装 feeds
        run: |
          cd $GITHUB_WORKSPACE/openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a
      - name: 第二阶段自定义脚本
        run: |
          cd $GITHUB_WORKSPACE/openwrt
          [ -f ${{ env.DIY_P2_SH }} ] && ./${{ env.DIY_P2_SH }}
      - name: SSH调试
        uses: P3TERX/ssh2actions@v1.0.0
        if: github.event.inputs.ssh == 'true'
      - name: 编译 OpenWrt
        run: |
          cd $GITHUB_WORKSPACE/openwrt
          make defconfig
          make -j$(nproc) V=s

      - name: 生成直写镜像
        run: |
          set -eo pipefail
          [ -f "$GITHUB_WORKSPACE/Scripts/convert2.sh" ] || { echo "convert2.sh 不存在，跳过"; exit 0; }
          chmod +x $GITHUB_WORKSPACE/Scripts/convert2.sh
          $GITHUB_WORKSPACE/Scripts/convert2.sh

      - name: 准备Release正文
        id: tag_release
        if: env.UPLOAD_RELEASE == 'true' && !cancelled()
        run: |
          set -eo pipefail
          echo "release_tag=OneCloud-$(date +"%Y.%m.%d-%H%M")" >> $GITHUB_OUTPUT
          echo "📦 OneCloud OpenWrt 固件" > release_body.txt
          echo "编译时间: $(date +"%Y-%m-%d %H:%M")" >> release_body.txt
          echo "源码分支: ${{ env.REPO_BRANCH }}" >> release_body.txt
          echo "" >> release_body.txt
          echo "openwrt.img.xz      → 晶晨宝盒整盘刷写（全新/清空eMMC）" >> release_body.txt
          echo "openwrt.burn.img.xz → USB Burning Tool线刷包（日常升级，保留分区表）" >> release_body.txt
          echo "*.sha256            → SHA256校验文件" >> release_body.txt
      - name: 上传固件到GitHub Release
        uses: softprops/action-gh-release@v2
        if: steps.tag_release.outputs.release_tag != '' && !cancelled()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.tag_release.outputs.release_tag }}
          body_path: release_body.txt
          files: |
            ${{ github.workspace }}/*.xz
            ${{ github.workspace }}/*.sha256
          draft: false
          prerelease: false
      - name: 上传制品到Artifacts
        uses: actions/upload-artifact@v4
        if: !cancelled()
        with:
          name: onecloud-openwrt-firmware
          path: |
            ${{ github.workspace }}/*.xz
            ${{ github.workspace }}/*.sha256
            ${{ github.workspace }}/openwrt/bin/targets
