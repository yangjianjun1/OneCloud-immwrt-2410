name: 编译 OneCloud OpenWrt

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      ssh:
        description: '开启 Actions SSH 调试连接'
        required: false
        default: 'false'
  # 每月10日自动编译（北京时间10号0点 = UTC时间9号16点，Github cron使用UTC）
  schedule:
    - cron: '0 16 10 * *'

env:
  REPO_URL: https://github.com/openwrt/openwrt.git
  REPO_BRANCH: openwrt-24.10
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: onecloud.config
  DIY_P1_SH: op1.sh
  DIY_P2_SH: op2.sh
  DIY_P3_SH: op3.sh
  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai
  CCACHE_DIR: /home/runner/.ccache

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 加载编译缓存 ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: openwrt-ccache-${{ env.REPO_BRANCH }}

      - name: 初始化编译环境
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -eo pipefail
          sudo rm -rf /etc/apt/sources.list.d/*
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache cmake cpio curl device-tree-compiler flex gawk gcc-multilib g++-multilib gettext git gzip libncurses5-dev libssl-dev libxml2-utils make msmtp nano ncurses-dev openssl patch perl python3 python3-pip python3-setuptools python3-dev rsync sed subversion swig tar unzip wget xz-utils zlib1g-dev
          sudo docker image prune --all --force

      - name: 克隆 OpenWrt 源码
        working-directory: /workdir
        run: |
          set -eo pipefail
          git clone ${{ env.REPO_URL }} -b ${{ env.REPO_BRANCH }} openwrt
          cd openwrt
          ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

      - name: 复制自定义配置与脚本
        run: |
          set -eo pipefail
          [ -d files ] && cp -rf files openwrt/
          [ -f ${{ env.CONFIG_FILE }} ] && cp ${{ env.CONFIG_FILE }} openwrt/.config
          [ -f ${{ env.DIY_P1_SH }} ] && chmod +x ${{ env.DIY_P1_SH }} && cp ${{ env.DIY_P1_SH }} openwrt/
          [ -f ${{ env.DIY_P2_SH }} ] && chmod +x ${{ env.DIY_P2_SH }} && cp ${{ env.DIY_P2_SH }} openwrt/
          [ -f ${{ env.DIY_P3_SH }} ] && chmod +x ${{ env.DIY_P3_SH }} && cp ${{ env.DIY_P3_SH }} openwrt/

      - name: 执行第一阶段自定义脚本
        run: |
          set -eo pipefail
          cd openwrt
          [ -f ${{ env.DIY_P1_SH }} ] && ./${{ env.DIY_P1_SH }}

      - name: 更新软件源 feeds
        run: |
          set -eo pipefail
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 执行第二阶段自定义脚本
        run: |
          set -eo pipefail
          cd openwrt
          [ -f ${{ env.DIY_P2_SH }} ] && ./${{ env.DIY_P2_SH }}

      - name: SSH远程调试（按需开启）
        uses: P3TERX/ssh2actions@v1.0.0
        if: (github.event.inputs.ssh == 'true' && github.event.inputs.ssh != 'false') || contains(github.event.action, 'ssh')
        env:
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

      - name: 下载源码包
        id: package
        run: |
          set -eo pipefail
          cd openwrt
          make defconfig
          make download -j8
          find dl -size -1024c -exec rm -f {} \;

      - name: 编译固件
        id: compile
        run: |
          set -eo pipefail
          cd openwrt
          echo "使用 $(nproc) 线程进行编译"
          export PATH="/usr/lib/ccache:$PATH"
          make -j$(nproc) || make -j1 || make -j1 V=s

          echo "status=success" >> $GITHUB_OUTPUT
          grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
          if [ -s DEVICE_NAME ]; then
            DEV_NAME=$(cat DEVICE_NAME)
            echo "DEVICE_NAME=_${DEV_NAME}" >> $GITHUB_ENV
          fi
          echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

          IMG_FILE=$(find bin/targets -maxdepth 3 \( -name "*.img.gz" -o -name "*.img" \) | head -n1)
          if [ -n "${IMG_FILE}" ]; then
            IMG_DIR=$(dirname "${IMG_FILE}")
            IMG_NAME=$(basename "${IMG_FILE}")
            echo "✅ 找到固件文件"
            echo "固件目录: openwrt/${IMG_DIR}"
            echo "固件文件名: ${IMG_NAME}"
            echo "IMG_FILE=${IMG_FILE}" >> $GITHUB_ENV
            ls -lh "${IMG_DIR}"
          else
            echo "❌ 警告：未找到 *.img / *.img.gz 固件文件"
            find bin/targets -type f
            exit 1
          fi

      - name: 执行第三阶段脚本，生成直写镜像
        run: |
          set -eo pipefail
          cd openwrt
          [ -f $GITHUB_WORKSPACE/${{ env.DIY_P3_SH }} ] && $GITHUB_WORKSPACE/${{ env.DIY_P3_SH }}

      - name: 查看磁盘占用
        if: (!cancelled())
        run: df -hT

      - name: 上传完整bin目录产物
        uses: actions/upload-artifact@v4
        if: steps.compile.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true'
        with:
          name: OpenWrt-bin${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
          path: openwrt/bin

      - name: 整理固件目录
        id: organize
        if: env.UPLOAD_FIRMWARE == 'true' && !cancelled()
        run: |
          set -eo pipefail
          shopt -s nullglob
          target_dirs=(openwrt/bin/targets/*/*)
          if [ ${#target_dirs[@]} -eq 0 ]; then
            echo "错误：未找到 targets 输出目录"
            exit 1
          fi
          echo "FIRMWARE=${target_dirs[0]}" >> $GITHUB_ENV
          rm -rf "${target_dirs[0]}/packages"
          echo "status=success" >> $GITHUB_OUTPUT

      - name: 上传固件文件夹
        uses: actions/upload-artifact@v4
        if: steps.organize.outputs.status == 'success' && !cancelled()
        with:
          name: OpenWrt-firmware${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
          path: ${{ env.FIRMWARE }}

      - name: 生成Release标签与说明文档
        id: tag
        if: env.UPLOAD_RELEASE == 'true' && !cancelled()
        run: |
          set -eo pipefail
          echo "release_tag=OneCloud-$(date +"%Y.%m.%d-%H%M")" >> $GITHUB_OUTPUT
          echo "📦 OpenWrt OneCloud 固件" > release.txt
          echo "编译时间: $(date +"%Y-%m-%d %H:%M")" >> release.txt
          echo "源码分支: ${{ env.REPO_BRANCH }}" >> release.txt
          echo "触发方式: ${{ github.event_name }}" >> release.txt
          echo "status=success" >> $GITHUB_OUTPUT

      - name: 列出固件全部文件
        if: steps.tag.outputs.status == 'success' && !cancelled()
        run: |
          find ${{ env.FIRMWARE }} -type f -ls

      - name: 上传固件到GitHub Release
        uses: softprops/action-gh-release@v3
        if: steps.tag.outputs.status == 'success' && !cancelled()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.tag.outputs.release_tag }}
          body_path: release.txt
          fail_on_unmatched_files: false
          files: |
            ${{ env.FIRMWARE }}/*.xz
            ${{ env.FIRMWARE }}/*.sha
            ${{ env.FIRMWARE }}/*.img
            ${{ env.FIRMWARE }}/*.img.gz

      - name: 清理旧工作流运行记录
        uses: Mattraks/delete-workflow-runs@v2
        with:
          retain_days: 7
          keep_minimum_runs: 5

      - name: 删除旧版本Release
        uses: dev-drprasad/delete-older-releases@v0.3.4
        continue-on-error: true
        with:
          keep_latest: 6
          delete_tags: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
