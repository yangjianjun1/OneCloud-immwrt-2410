name: Build OneCloud 1

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      ssh:
        description: 'SSH connection to Actions'
        required: false
        default: 'false'

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt.git
  REPO_BRANCH: openwrt-24.10
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: onecloud.config
  DIY_P1_SH: op1.sh
  DIY_P2_SH: op2.sh
  DIY_P3_SH: op3.sh
  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai
  # 缓存key前缀
  CACHE_KEY_PREFIX: immortalwrt-24.10-onecloud

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
    - name: Checkout
      uses: actions/checkout@main

    - name: Print runner info
      run: |
        echo "==== Runner Info ===="
        uname -a
        free -h
        df -h
        lscpu
        echo "====================="

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc
        sudo docker image prune --all --force
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install ack antlr3 asciidoc autopoint bzip2 ccache cmake cpio device-tree-compiler fastjar gperf haveged help2man intltool libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libpython3-dev libreadline-dev libssl-dev libtool lrzsz mkisofs msmtp ninja-build p7zip p7zip-full patch pkgconf python3-pyelftools qemu-utils scons texinfo uglifyjs upx-ucl xmlto xxd
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /workdir
        sudo chown $USER:$GROUPS /workdir

        # 创建12G交换分区，先关闭已有swap，规避占用删除失败
        echo "Create swap file..."
        if [ -f /swapfile ]; then
          sudo swapoff /swapfile || true
        fi
        sudo rm -f /swapfile
        sudo dd if=/dev/zero of=/swapfile bs=1M count=12288 status=none
        sudo chmod 600 /swapfile
        sudo mkswap /swapfile
        sudo swapon /swapfile
        sudo sysctl -w vm.swappiness=10
        echo "==== 内存与swap状态 ===="
        free -h
        echo "================================="

    - name: Clone source code
      working-directory: /workdir
      run: |
        git clone $REPO_URL -b $REPO_BRANCH openwrt
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

    - name: Load onecloud target
      run: |
        [ -e target ] && cp -rf target openwrt/

    - name: Load custom feeds
      run: |
        [ -e $FEEDS_CONF ] && mv $FEEDS_CONF openwrt/feeds.conf.default
        chmod +x $DIY_P1_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P1_SH

    - name: Update feeds
      run: cd openwrt && ./scripts/feeds update -a

    - name: Remove some feeds
      run: |
        chmod +x $DIY_P3_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P3_SH

    - name: Second update feeds
      run: cd openwrt && ./scripts/feeds update -a

    - name: Install feeds
      run: cd openwrt && ./scripts/feeds install -a

    - name: Load custom configuration
      run: |
        [ -e files ] && mv files openwrt/files
        [ -e $CONFIG_FILE ] && mv $CONFIG_FILE openwrt/.config
        chmod +x $DIY_P2_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P2_SH

    - name: Restore ccache cache
      uses: actions/cache@v4
      with:
        path: /workdir/openwrt/.ccache
        key: ${{ env.CACHE_KEY_PREFIX }}-ccache-${{ github.run_id }}
        restore-keys: |
          ${{ env.CACHE_KEY_PREFIX }}-ccache-

    - name: Restore dl cache
      uses: actions/cache@v4
      with:
        path: /workdir/openwrt/dl
        key: ${{ env.CACHE_KEY_PREFIX }}-dl-${{ hashFiles('/workdir/openwrt/feeds.conf.default') }}
        restore-keys: |
          ${{ env.CACHE_KEY_PREFIX }}-dl-

    - name: SSH connection to Actions
      uses: P3TERX/ssh2actions@v1.0.0
      if: (github.event.inputs.ssh == 'true' && github.event.inputs.ssh  != 'false') || contains(github.event.action, 'ssh')
      env:
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

    - name: Pre-download source files
      run: |
        cd openwrt
        make defconfig
        make download -j8
        find dl -size -1024c -exec rm -f {} \;
        echo "✅ 预下载完成"

    - name: Compile the firmware
      id: compile
      run: |
        cd openwrt
        export CCACHE_DIR=$PWD/.ccache
        export CCACHE_MAXSIZE=10G
        ccache -z
        make -j$(nproc) V=s || make -j1 V=s
        ccache -s
        echo "status=success" >> $GITHUB_OUTPUT
        grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
        [ -s DEVICE_NAME ] && echo "DEVICE_NAME=_$(cat DEVICE_NAME)" >> $GITHUB_ENV
        echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

    - name: Generate direct burn
      run: |
        chmod +x $GITHUB_WORKSPACE/Scripts/convert1.sh
        $GITHUB_WORKSPACE/Scripts/convert1.sh

    - name: Organize files & generate sha256sum
      if: steps.compile.outputs.status == 'success'
      run: |
        cd openwrt/bin/targets/*/*
        rm -rf packages
        sha256sum * > sha256sums.txt
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV

    - name: Upload firmware to release
      uses: softprops/action-gh-release@v1
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_RELEASE == 'true'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.run_id }}
        files: ${{ env.FIRMWARE }}/*

    - name: Telegram notify success
      if: steps.compile.outputs.status == 'success'
      run: |
        curl -s "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
        -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
        -d "text=✅ OneCloud固件编译成功！RunID:${{ github.run_id }}"

    - name: Telegram notify failed
      if: failure()
      run: |
        curl -s "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
        -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
        -d "text=❌ OneCloud固件编译失败！RunID:${{ github.run_id }}"
